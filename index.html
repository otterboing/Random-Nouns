<!DOCTYPE html>
<html>
<head>

<title>Random Words</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div area id="app">
<div style="position: absolute; left: 5px; bottom: 5px; color: grey; display: flex; flex-direction: row; juftify-content: center; align-items: center; gap: 0.5rem; font-size: 0.80rem; font-weight: lighter;">
    <span>Time Spent On this: 2h 30min</span>
    <a target="_blank" href="https://github.com/otterboing/Random-Nouns" style="color: grey!important;"><img src="assets/GitHub_Invertocat_Black.svg" style="width: 0.80rem; height: 0.80rem; user-select: none; -webkit-user-drag: none; -moz-user-drag: none;"> GitHub</a></div>
<div id="center">
    <div id="words-list">
        Make Words!
    </div>
        <button id="generate_words" onclick="populateWords(); if (runtime.auto_copy) {copyWords();}" style="margin: 1rem; padding: 0.5rem; background-color: black; color: white; font-size: 1.25rem;">New Words</button>
        <div id="options">
        <span>Amount:</span>
        <input id="wordsAmount" type="number" min="0" value="2" onchange="runtime.words_amount = this.value">
        <span>Spacer:</span>
        <input id="wordSpacer" type="text" value=" " placeholder="Try Space" onchange="runtime.word_spacer = this.value">
        <button onclick="copyWords();"><b>Copy</b></button>
        <span>Auto Copy:</span>
        <input type="checkbox" onchange="runtime.auto_copy = !!this.checked;">
        <span>Capitalize:</span>
        <input id="capitalize_words" type="checkbox" onclick="runtime.uppercase = !!this.checked; update_words(); if (runtime.auto_copy) {copyWords();}">
    </div>
    <div><span>Warning : </span><span style="color: darkred; font-weight: bold;">Words May Contain Or Make Swear Words.</span></div>
    <div style="display: flex; flex-direction: column; text-align: center;"><span>Words taken from : </span><a target="_blank" href="https://github.com/sapics/noun-json/blob/master/output.js">https://github.com/sapics/noun-json/blob/master/output.js</a><a target="_blank" href="https://github.com/sapics/noun-json/blob/master/LICENSE">MIT License</a></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
